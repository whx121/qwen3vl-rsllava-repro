[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen3vl-rsllava-repro"
version = "0.1.0"
description = "Qwen3-VL-4B LoRA SFT on RS-LLaVA remote-sensing instructions"
requires-python = ">=3.10,<3.13"
dependencies = [
  "accelerate>=1.7.0",
  "datasets>=3.0.0",
  "numpy>=1.26",
  "peft>=0.17.1",
  "Pillow>=10.0",
  "qwen-vl-utils>=0.0.14",
  "safetensors>=0.4.5",
  "torch>=2.6.0",
  "torchvision>=0.21.0",
  "tqdm>=4.66.0",
  "transformers>=4.57.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
